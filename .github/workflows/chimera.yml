name: chimera-e2e
on: [push, pull_request]
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PKGS: dinit openssh openssh-dinit dbus dbus-dinit dbus-dinit-links chrony chrony-dinit cronie cronie-dinit
      ZINIT_VER: v0.0.2
      ZINIT_TGZ: zinit-v0.0.2-x86_64-unknown-linux-musl.tar.gz
      ZINIT_DIR: zinit-v0.0.2-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - name: corpus
        run: |
          docker pull chimeralinux/chimera:latest
          rm -rf corpus && mkdir corpus
          docker run --rm -e PKGS -v "$PWD:/work" chimeralinux/chimera:latest \
            sh -c 'apk update >/dev/null && apk add $PKGS >/dev/null && for d in /etc/dinit.d /usr/lib/dinit.d; do [ -d "$d" ] && { mkdir -p "/work/corpus/$(basename $d)"; cp "$d"/* "/work/corpus/$(basename $d)/"; }; done; find /work/corpus -type f | wc -l'
          test "$(find corpus -type f | wc -l)" -gt 0
      - name: translate
        run: |
          rm -rf out && mkdir out && rm -f warn.log && touch warn.log
          for d in corpus/*/; do ./dinit-import.sh "$d" out 2>>warn.log || exit 1; done
          echo "files=$(find corpus -type f | wc -l) generated=$(ls out | wc -l)"
          sort warn.log | uniq -c | sort -rn | head -20
      - name: c1
        run: |
          gh release download "$ZINIT_VER" -R SrDicov/zinit --pattern '*x86_64*'
          tar xzf "$ZINIT_TGZ"
          docker run --rm -e PKGS -e ZINIT_DIR -v "$PWD:/work" chimeralinux/chimera:latest \
            sh -c 'apk update >/dev/null && apk add $PKGS >/dev/null && exec /work/$ZINIT_DIR/zinit check /work/out'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: boot
        run: |
          rm -rf payload && mkdir payload
          cp "$ZINIT_DIR/zinit" "$ZINIT_DIR/zctl" payload/
          cp -r out payload/out
          docker run -d --name zb \
            -e PKGS -e ZINIT_CONFIG_DIRS=/z/out -e ZINIT_SOCKET=/z/ctl -e ZINIT_STATE_DIR=/z/state \
            -v "$PWD/payload:/z" \
            chimeralinux/chimera:latest sh -c 'apk update >/dev/null && apk add $PKGS >/dev/null && exec /z/zinit --init'
          sleep 20
          test "$(docker inspect -f '{{.State.Running}}' zb)" = true
          docker exec -e ZINIT_SOCKET=/z/ctl zb /z/zctl list | tee states.txt
          for s in sshd dbus-daemon chronyd boot system early-cryptdisks; do docker exec -e ZINIT_SOCKET=/z/ctl zb /z/zctl status "$s"; done | tee status.txt
          docker logs zb >zb.log 2>&1 || true
          tail -5 zb.log
          docker rm -f zb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-e2e
          path: |
            out
            warn.log
            states.txt
            status.txt
            zb.log
